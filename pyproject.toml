[project]
name = "fastapi-example"
version = "0.1.0"
description = "A simple FastAPI example project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120.2",
    "httpx>=0.28.1",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["hatchling"]

build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_example"]

[tool.hatch.metadata]
allow-direct-references = true
